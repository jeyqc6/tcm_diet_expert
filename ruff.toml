# docs/ENGINEERING.md §8 CI pipeline 第一步"lint (ruff)"的配置。
#
# 只选 E(pycodestyle)+ F(pyflakes)——真实的正确性问题(未定义名/未使用的
# import/未使用的变量等)，不引入 ruff 更大的默认规则集(pyupgrade/bugbear/
# simplify 等一大堆风格类规则)：这份代码库此前从未跑过 lint，一次性开满
# 规则会先报几百条和这次改动无关的历史问题，不是"新代码不能引入新问题"该
# 有的信噪比。E/F 之外的规则要不要逐步开，是以后的事，不是这次顺带决定的。
#
# 忽略 E501(行太长)：这份代码库的注释习惯是大段中文解释"为什么这么做"，
# 经常超过传统的 79/88 字符——限制行宽对这种写法没有意义，反而会逼着把
# 有用的上下文拆成难读的多行。
[lint]
select = ["E", "F"]
ignore = ["E501"]
